<header class="fixed inset-x-0 top-0 z-[120] h-16 border-b transition-all duration-300 bg-void/80 backdrop-blur-md border-subtle/10">
  <div class="investor-container flex h-full items-center justify-between">
    <a routerLink="/" class="flex items-center gap-3 text-text-primary no-underline">
      <img src="logo.jpg" alt="Tensor.Dev Logo" class="h-12 w-auto rounded-md" />
      <span class="font-display text-lg tracking-[-0.02em] text-text-primary">Tensor.Dev</span>
    </a>
    
    <nav class="hidden items-center gap-8 md:flex">
      <a routerLink="/" routerLinkActive="text-text-primary" [routerLinkActiveOptions]="{exact: true}" class="inline-flex items-center font-sans text-[12px] font-normal uppercase leading-none tracking-[0.18em] text-text-muted transition-colors hover:text-text-primary">Inicio</a>
      <a routerLink="/servicios" routerLinkActive="text-text-primary" class="inline-flex items-center font-sans text-[12px] font-normal uppercase leading-none tracking-[0.18em] text-text-muted transition-colors hover:text-text-primary">Servicios</a>
      <a routerLink="/nosotros" routerLinkActive="text-text-primary" class="inline-flex items-center font-sans text-[12px] font-normal uppercase leading-none tracking-[0.18em] text-text-muted transition-colors hover:text-text-primary">Nosotros</a>
      <a routerLink="/labs" routerLinkActive="text-text-primary" class="inline-flex items-center font-sans text-[12px] font-normal uppercase leading-none tracking-[0.18em] text-text-muted transition-colors hover:text-text-primary">Labs</a>
      <a routerLink="/contacto" routerLinkActive="text-text-primary" class="inline-flex items-center font-sans text-[12px] font-normal uppercase leading-none tracking-[0.18em] text-text-muted transition-colors hover:text-text-primary">Contacto</a>
    </nav>
    
    <div class="hidden md:flex items-center gap-4">
      <a routerLink="/contacto" class="button-ghost !h-9 !px-4 !text-[11px]">Auditoría</a>
    </div>
  </div>
</header>
